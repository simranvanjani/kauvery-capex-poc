command: ["uv", "run", "start-server"]
# databricks apps listen on port 8000; start-server serves our custom UI + /api + the agent.
# Auth: all tool calls run as the app SERVICE PRINCIPAL (OBO/user_api_scopes was unreliable in this
# workspace — user tokens weren't granted the requested scopes). The SP is granted the UC
# permissions (USE CATALOG/SCHEMA, SELECT on the history table, EXECUTE on the functions, READ/WRITE
# VOLUME) plus the endpoint/warehouse resource grants declared on the app.

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  # Warehouse the agent's UC-function / ai_query SQL tools run against (resource attached to the app).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  # ---- CAPEX config ----
  - name: CATALOG
    value: "kauvey_poc"
  - name: SCHEMA
    value: "gold"
  - name: MODEL_ENDPOINT
    value: "capex-worth-it"
  - name: CHAT_MODEL
    value: "databricks-claude-sonnet-4-5"
  # PDF extraction ai_query needs json_object responseFormat (unsupported by Claude) -> keep Llama.
  - name: EXTRACT_MODEL
    value: "databricks-llama-4-maverick"
  # Lakebase schema the app SP creates & OWNS on startup. Fresh name avoids the user-owned 'capex'
  # test schema (SP has CAN_CONNECT_AND_CREATE; it can only use schemas it created).
  - name: LAKEBASE_SCHEMA
    value: "capex_hist"
