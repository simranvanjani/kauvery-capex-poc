command: ["uv", "run", "start-server"]
# databricks apps listen on port 8000; start-server serves our custom UI + /api + the agent.

# On-behalf-of-user (OBO): the app forwards the signed-in user's token (x-forwarded-access-token)
# and the agent's tools act AS THAT USER. These are the scopes the app may request; Databricks still
# enforces the user's own grants on the warehouse / endpoints / volumes.
#   sql                        -> warehouse SQL (history UC functions + ai_query PDF parse)
#   serving.serving-endpoints  -> scoring model (capex-worth-it) + FM extract/chat endpoints
#   files.files                -> upload the quotation PDF to the UC Volume
# (iam.current-user:read / iam.access-control:read are added automatically — they are NOT
#  requestable here; listing them makes the whole user_api_scopes list get rejected.)
user_api_scopes:
  - sql
  - serving.serving-endpoints
  - files.files

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  # Warehouse the agent's UC-function / ai_query SQL tools run against (resource attached to the app).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  # ---- CAPEX config ----
  - name: CATALOG
    value: "kauvey_poc"
  - name: SCHEMA
    value: "gold"
  - name: MODEL_ENDPOINT
    value: "capex-worth-it"
  - name: CHAT_MODEL
    value: "databricks-claude-sonnet-4-5"
  # PDF extraction ai_query needs json_object responseFormat (unsupported by Claude) -> keep Llama.
  - name: EXTRACT_MODEL
    value: "databricks-llama-4-maverick"
  # Lakebase schema the app SP creates & OWNS on startup. Fresh name avoids the user-owned 'capex'
  # test schema (SP has CAN_CONNECT_AND_CREATE; it can only use schemas it created).
  - name: LAKEBASE_SCHEMA
    value: "capex_hist"
